x-service-env: &service-env
  # Single source of truth for the database. Point this at your Supabase session-pooler
  # URL (port 5432, NOT the 6543 transaction pooler — asyncpg/LangGraph need prepared
  # statements), or at the bundled local Postgres via the `local-db` profile.
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL (Supabase session-pooler URL, or the local-db value from .env.example)}
  REDIS_URL: redis://redis:6379
  STORAGE_PROVIDER: minio
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-plantbrain-documents}
  AI_SERVICE_URL: http://ai:8000
  LOG_LEVEL: info
  APP_ENV: development
  UPLOADS_DIR: /app/uploads
  CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  # Local Postgres for offline development. Disabled by default so the stack targets
  # DATABASE_URL (e.g. Supabase). Enable with: docker compose --profile local-db up
  postgres:
    image: pgvector/pgvector:pg16
    container_name: plantbrain-postgres
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantbrain}
      POSTGRES_USER: ${POSTGRES_USER:-plantbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantbrain}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantbrain} -d ${POSTGRES_DB:-plantbrain}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: plantbrain-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: plantbrain-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    container_name: plantbrain-api
    environment:
      <<: *service-env
      PORT: 8080
      S3_ENDPOINT: minio:9000 # in-network endpoint used for uploads/bucket ops
      # Browser-reachable endpoint used only for presigning download URLs. The signed
      # host must resolve from the user's browser, which `minio` (docker DNS) does not.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      API_RATE_LIMIT: 300
      API_RATE_LIMIT_WINDOW: 1m
      API_AUTH_RATE_LIMIT: 120
      API_AUTH_RATE_LIMIT_WINDOW: 1m
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: ./services/ai
    container_name: plantbrain-ai
    environment:
      <<: *service-env
      PORT: 8000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_RATE_LIMIT_RPS: 5.0
      AI_RATE_LIMIT_BURST: 20.0
    expose:
      - "8000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        - NEXT_API_URL=http://api:8080
        - NEXT_AI_URL=http://ai:8000
    container_name: plantbrain-web
    environment:
      NEXT_API_URL: http://api:8080
      NEXT_AI_URL: http://ai:8000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
      - ai
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  uploads-data:
