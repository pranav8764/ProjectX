x-service-env: &service-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  STORAGE_PROVIDER: minio
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  STORAGE_BUCKET: ${STORAGE_BUCKET:?Set STORAGE_BUCKET}
  AI_SERVICE_URL: http://ai:8000
  LOG_LEVEL: info
  APP_ENV: development
  UPLOADS_DIR: /app/uploads

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: plantbrain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: plantbrain-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: plantbrain-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ./services/api
    container_name: plantbrain-api
    environment:
      <<: *service-env
      PORT: 8080
      S3_ENDPOINT: minio:9000 # inside docker network
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - postgres
      - redis
      - minio

  ai:
    build:
      context: ./services/ai
    container_name: plantbrain-ai
    environment:
      <<: *service-env
      PORT: 8000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    expose:
      - "8000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres-data:
  minio-data:
  uploads-data:
