services:
  - name: api
    folder: services/api
    port: 8080
    type: http
    public: true
    contract: contracts/openapi/api.yaml
    owns_schema:
      - identity
      - document
      - asset
      - compliance
      - report
      - rag
      - rca
  - name: ai
    folder: services/ai
    port: 8000
    type: http
    public: false
    contract: contracts/openapi/ai.yaml
    owns_schema:
      - ingestion
      - graph
      - rag
      - rca
      - compliance
      - ai
