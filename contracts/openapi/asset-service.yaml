openapi: 3.1.0
info:
  title: Asset Service
  version: 0.1.0
paths:
  /health:
    get:
      responses:
        "200":
          description: Healthy
  /internal/assets:
    get:
      summary: List assets
      responses:
        "200":
          description: Asset list
  /internal/assets/{assetId}:
    get:
      summary: Get asset profile
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset profile

