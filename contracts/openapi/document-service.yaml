openapi: 3.1.0
info:
  title: "Legacy planning sketch: Document Service"
  version: 0.1.0
  description: Legacy domain-service contract sketch for a possible future split. Document APIs currently run in services/api.
x-contract-status: legacy-domain-sketch
paths:
  /health:
    get:
      responses:
        "200":
          description: Healthy
  /internal/documents:
    get:
      summary: List documents
      responses:
        "200":
          description: Document list
  /internal/documents/upload-session:
    post:
      summary: Create upload session
      responses:
        "201":
          description: Upload session created
  /internal/documents/{documentId}/status:
    patch:
      summary: Update processing status
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status updated
