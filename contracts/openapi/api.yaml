        evidenceDocumentId:
          type: string
        evidenceChunkId:
          type: string
    ReportJobRequest:
      type: object
      required: [reportType]
      properties:
        plantId:
          type: string
          format: uuid
        reportType:
          type: string
          enum:
            - asset_summary
            - compliance_gap
            - document_inventory
            - rca_report
            - query_answers
        format:
          type: string
          description: Top-level report format. If omitted, the API also accepts parameters.format before defaulting to csv.
          default: csv
          enum:
            - csv
            - pdf
            - docx
        parameters:
          type: object
          additionalProperties: true
    ReportJob:
      type: object
      properties:
        id:
          type: string
        reportType:
          type: string
        format:
          type: string
          description: Present on create responses. List responses do not currently persist report format separately.
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
        errorMessage:
          type: string
    ReportJobCreated:
      allOf:
        - $ref: "#/components/schemas/ReportJob"
        - type: object
          properties:
            message:
              type: string
