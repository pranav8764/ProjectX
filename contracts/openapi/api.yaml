openapi: 3.1.0
info:
  title: PlantBrainAI Consolidated API
  version: 0.1.0
  description: Public Go API/BFF implemented by services/api for the consolidated MVP runtime. All /api routes require an authenticated session token or cookie and enforce plant membership; selected routes also enforce role gates.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/me:
    get:
      summary: Get authenticated user context
      tags: [Auth]
      x-rbac: Any authenticated user
      responses:
        "200":
          description: Current user context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/documents:
    get:
      summary: List documents
      tags: [Documents]
      description: Returns document metadata visible in the caller's plant scope, including access metadata that clients use to distinguish metadata visibility from original-source download permission.
      x-rbac: Any authenticated user in the requested plant scope
      parameters:
        - $ref: "#/components/parameters/PlantIdQuery"
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/documents/{id}:
    get:
      summary: Get document detail
      tags: [Documents]
      description: Returns document metadata and derived extraction artifacts. Restricted or confidential source files still require the caller to satisfy the document's source access policy before download.
      x-rbac: Any authenticated user with plant access
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Archive a document
      tags: [Documents]
      x-rbac: [admin, engineer]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Document archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentArchiveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/documents/{id}/status:
    get:
      summary: Get document processing status
      tags: [Documents]
      x-rbac: Any authenticated user with plant access
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Document status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/documents/{id}/download:
    get:
      summary: Create a short-lived signed URL for the original document file
      tags: [Documents]
      description: Returns a MinIO/S3 presigned URL for the original upload when the caller has plant access and satisfies the document's accessLevel/allowedRoles source policy. The URL expires after 600 seconds.
      x-rbac: Plant access plus document source-download policy
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Signed download link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDownloadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/documents/{id}/retry-processing:
    post:
      summary: Retry AI processing for an uploaded document
      tags: [Documents]
      description: Requeues the current document version and asks the AI service to process the shared upload file again. If processing is already active, the API returns 409.
      x-rbac: [admin, engineer]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "202":
          description: Processing retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentProcessingRetryResponse"
        "200":
          description: Retry was attempted but the AI service did not accept the job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentProcessingRetryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/documents/{id}/versions:
    post:
      summary: Upload a newer source version for an existing document
      tags: [Documents]
      description: Adds a new document version, makes it the current version, clears stale extracted evidence for the previous version, and queues AI processing for the new source.
      x-rbac: Plant access plus document source-download policy
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  description: Optional replacement title.
                versionLabel:
                  type: string
                  description: Optional label such as v2. Defaults to the next numeric vN label.
      responses:
        "202":
          description: Version uploaded and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersionUploadResponse"
        "200":
          description: Duplicate version detected or AI processing failed after upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersionUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/documents/upload:
    post:
      summary: Upload a document and trigger AI processing
      tags: [Documents]
      x-rbac: Any authenticated user in the requested plant scope
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [plantId, documentType, file]
              properties:
                plantId:
                  type: string
                  format: uuid
                documentType:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload accepted or duplicate detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/copilot/query:
    post:
      summary: Ask the RAG copilot
      tags: [Copilot]
      x-rbac: Any authenticated user in the requested plant scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotQueryRequest"
      responses:
        "200":
          description: Cited answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/dashboard/metrics:
    get:
      summary: Get dashboard metrics
      tags: [Dashboard]
      x-rbac: [admin, plant_manager, engineer, compliance_officer]
      parameters:
        - $ref: "#/components/parameters/PlantIdQuery"
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/assets:
    get:
      summary: List assets
      tags: [Assets]
      x-rbac: Any authenticated user in the requested plant scope
      parameters:
        - $ref: "#/components/parameters/PlantIdQuery"
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/assets/{id}:
    get:
      summary: Get asset profile by id or asset tag
      tags: [Assets]
      x-rbac: Any authenticated user with plant access
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Asset profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/rca/generate:
    post:
      summary: Generate RCA for an asset
      tags: [RCA]
      x-rbac: [admin, plant_manager, engineer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RcaGenerateRequest"
      responses:
        "200":
          description: RCA result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RcaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/compliance/gaps:
    get:
      summary: List compliance gaps
      tags: [Compliance]
      x-rbac: [admin, plant_manager, engineer, compliance_officer]
      parameters:
        - $ref: "#/components/parameters/PlantIdQuery"
      responses:
        "200":
          description: Compliance gaps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceGap"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/compliance/scan:
    post:
      summary: Run a compliance scan for a plant
      tags: [Compliance]
      x-rbac: [admin, plant_manager, compliance_officer]
      parameters:
        - name: plantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Required unless the authenticated session is scoped to a plant.
      responses:
        "200":
          description: Compliance scan result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceScanGap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/graph:
    get:
      summary: Get graph entities and relationships
      tags: [Graph]
      x-rbac: Any authenticated user in the requested plant scope
      parameters:
        - $ref: "#/components/parameters/PlantIdQuery"
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/reports:
    get:
      summary: List report jobs
      tags: [Reports]
      x-rbac: [admin, plant_manager, engineer, compliance_officer]
      parameters:
        - $ref: "#/components/parameters/PlantIdQuery"
      responses:
        "200":
          description: Report jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportJob"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a CSV, PDF, or DOCX report job
      tags: [Reports]
      description: The MVP generates the report synchronously, stores it under the API uploads volume, and returns a download route when rendering succeeds.
      x-rbac: [admin, plant_manager, engineer, compliance_officer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportJobRequest"
      responses:
        "201":
          description: Report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportJobCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/reports/{id}/download:
    get:
      summary: Download a completed report
      tags: [Reports]
      x-rbac: [admin, plant_manager, engineer, compliance_officer]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Generated report file
          content:
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    PlantIdQuery:
      name: plantId
      in: query
      required: false
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user does not have one of the required roles
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Resource is archived or no longer downloadable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: api
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    RoleKey:
      type: string
      enum:
        - admin
        - plant_manager
        - engineer
        - technician
        - compliance_officer
        - viewer
    DocumentAccessLevel:
      type: string
      description: Metadata visibility and source-download policy bucket for a document.
      enum:
        - public
        - internal
        - restricted
        - confidential
    DocumentSensitivity:
      type: string
      description: Business sensitivity label used by clients and policy checks.
      enum:
        - standard
        - sensitive
        - confidential
        - safety_critical
    DocumentAccessFields:
      type: object
      properties:
        accessLevel:
          $ref: "#/components/schemas/DocumentAccessLevel"
        sensitivity:
          $ref: "#/components/schemas/DocumentSensitivity"
        allowedRoles:
          type: array
          description: Roles that may download the original source evidence for this document. Metadata may still be visible to broader plant-scoped users.
          items:
            $ref: "#/components/schemas/RoleKey"
        sourceRestricted:
          type: boolean
          description: True when the source file is governed by a stricter policy than ordinary document metadata.
        sourceDownloadAllowed:
          type: boolean
          description: Whether the current caller may request /api/documents/{id}/download for this document.
    CurrentUser:
      type: object
      required: [userId, orgId, plantId, role]
      properties:
        userId:
          type: string
        orgId:
          type: string
        plantId:
          type: string
        role:
          $ref: "#/components/schemas/RoleKey"
    DocumentSummary:
      allOf:
        - $ref: "#/components/schemas/DocumentAccessFields"
        - type: object
          required: [id, title, fileType, documentType, status, ocrConfidence, classificationConfidence, createdAt]
          properties:
            id:
              type: string
            title:
              type: string
            fileType:
              type: string
            documentType:
              type: string
            status:
              $ref: "#/components/schemas/DocumentStatus"
            ocrConfidence:
              type: number
            classificationConfidence:
              type: number
            createdAt:
              type: string
              format: date-time
            processingJobId:
              type: string
              nullable: true
            processingStatus:
              type: string
              nullable: true
              description: Latest ingestion job status when a job has been created.
            processingProgress:
              type: number
              nullable: true
              description: Latest processing progress percentage from 0 to 100.
            processingAttempts:
              type: integer
              nullable: true
              description: Number of times the current processing job has been queued or retried.
            retryAvailable:
              type: boolean
              description: True when the caller can retry the current failed or partial processing job.
            retryUrl:
              type: string
              nullable: true
            processingError:
              type: string
              nullable: true
            jobUpdatedAt:
              type: string
              format: date-time
              nullable: true
    DocumentStatus:
      type: string
      enum:
        - UPLOADED
        - EXTRACTING_TEXT
        - OCR_RUNNING
        - CONVERTING_TO_MARKDOWN
        - DETECTING_TABLES
        - CLASSIFYING
        - CHUNKING
        - EXTRACTING_ENTITIES
        - GENERATING_EMBEDDINGS
        - BUILDING_GRAPH
        - STORING_RESULTS
        - INDEXED
        - COMPLETED
        - PARTIAL_SUCCESS
        - FAILED
        - ARCHIVED
    DocumentStatusResponse:
      type: object
      required: [documentId, plantId, status, updatedAt, processingProgress]
      properties:
        documentId:
          type: string
        plantId:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        currentVersionId:
          type: string
        updatedAt:
          type: string
          format: date-time
        processingJobId:
          type: string
        processingStatus:
          type: string
        processingProgress:
          type: number
        processingAttempts:
          type: integer
        attempts:
          type: integer
          description: Backward-compatible alias for processingAttempts.
        retryAvailable:
          type: boolean
        retryUrl:
          type: string
        errorMessage:
          type: string
        lastAttemptedAt:
          type: string
          format: date-time
        nextRetryAt:
          type: string
          format: date-time
        lockedAt:
          type: string
          format: date-time
        lockedBy:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        jobUpdatedAt:
          type: string
          format: date-time
    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/DocumentAccessFields"
        - type: object
          required: [id, organizationId, plantId, title, documentType, status, createdAt, updatedAt, currentVersion, pages, chunks, entities]
          properties:
            id:
              type: string
            organizationId:
              type: string
            plantId:
              type: string
            title:
              type: string
            documentType:
              type: string
            status:
              $ref: "#/components/schemas/DocumentStatus"
            uploadedBy:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            currentVersion:
              $ref: "#/components/schemas/DocumentVersion"
            pages:
              type: array
              items:
                $ref: "#/components/schemas/DocumentPage"
            chunks:
              type: array
              description: Limited to the first 50 chunks in the current API response. Access-controlled deployments may omit or redact chunks that the current caller cannot use as evidence.
              items:
                $ref: "#/components/schemas/DocumentChunk"
            entities:
              type: array
              description: Limited to the top 100 entities by confidence in the current API response.
              items:
                $ref: "#/components/schemas/DocumentEntity"
    DocumentVersion:
      type: object
      properties:
        id:
          type: string
        versionLabel:
          type: string
        fileUrl:
          type: string
          description: Internal object-storage URL. Use /api/documents/{id}/download for a signed download URL.
        fileType:
          type: string
        fileSha256:
          type: string
        markdownContent:
          type: string
        ocrConfidence:
          type: number
        classificationConfidence:
          type: number
        createdAt:
          type: string
          format: date-time
    DocumentPage:
      type: object
      properties:
        pageNo:
          type: integer
        rawText:
          type: string
        markdownText:
          type: string
        ocrConfidence:
          type: number
        metadata:
          type: object
          additionalProperties: true
    DocumentChunk:
      type: object
      properties:
        id:
          type: string
        pageNo:
          type: integer
        chunkIndex:
          type: integer
        text:
          type: string
        tokenCount:
          type: integer
        metadata:
          type: object
          additionalProperties: true
    DocumentEntity:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        value:
          type: string
        normalizedValue:
          type: string
        confidence:
          type: number
        pageNo:
          type: integer
    DocumentArchiveResponse:
      type: object
      required: [documentId, status, message]
      properties:
        documentId:
          type: string
        status:
          type: string
          enum: [ARCHIVED]
        message:
          type: string
    DocumentUploadResponse:
      type: object
      required: [documentId, status, message]
      properties:
        documentId:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        duplicate:
          type: boolean
        message:
          type: string
        processingStatus:
          type: string
        processingProgress:
          type: number
        processingAttempts:
          type: integer
        retryAvailable:
          type: boolean
        retryUrl:
          type: string
    DocumentDownloadResponse:
      type: object
      required: [documentId, downloadUrl, expiresAt, expiresInSec]
      properties:
        documentId:
          type: string
        accessLevel:
          $ref: "#/components/schemas/DocumentAccessLevel"
        sensitivity:
          $ref: "#/components/schemas/DocumentSensitivity"
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        expiresInSec:
          type: integer
          example: 600
    DocumentProcessingRetryResponse:
      type: object
      required: [documentId, status, message]
      properties:
        documentId:
          type: string
        status:
          type: string
          enum:
            - QUEUED
            - FAILED
        processingStatus:
          type: string
        retryAvailable:
          type: boolean
        retryUrl:
          type: string
        processingAttempts:
          type: integer
        processingProgress:
          type: number
        message:
          type: string
    DocumentVersionUploadResponse:
      type: object
      required: [documentId, status, message]
      properties:
        documentId:
          type: string
        versionId:
          type: string
        versionLabel:
          type: string
        status:
          type: string
        duplicate:
          type: boolean
        processingStatus:
          type: string
        processingProgress:
          type: number
        retryAvailable:
          type: boolean
        retryUrl:
          type: string
        processingAttempts:
          type: integer
        message:
          type: string
    DashboardMetrics:
      type: object
      properties:
        totalDocuments:
          type: integer
        documentsProcessed:
          type: integer
        documentsFailed:
          type: integer
        assetsDiscovered:
          type: integer
        criticalAssets:
          type: integer
        repeatedFailures:
          type: integer
        complianceGaps:
          type: integer
        querySuccessRate:
          type: number
        averageQueryConfidence:
          type: number
        knowledgeGraphRelationships:
          type: integer
        knowledgeGraphCompleteness:
          type: number
        timeSavedEstimateMinutes:
          type: integer
        documentProcessingStatus:
          type: object
          additionalProperties:
            type: integer
        processingQueueDepth:
          type: integer
          description: Count of active queued or running ingestion jobs.
        processingRetryableDocuments:
          type: integer
          description: Count of documents with failed or partial jobs eligible for retry.
        processingAttempts:
          type: integer
          description: Sum of recorded ingestion job attempts in the current metrics scope.
    CopilotQueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        plantId:
          type: string
          format: uuid
        filters:
          type: object
          additionalProperties: true
          properties:
            assetTag:
              type: string
            documentTypes:
              type: array
              items:
                type: string
    CopilotQueryResponse:
      type: object
      required: [answer, confidence, citations, relatedAssets, missingInfo]
      properties:
        answer:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        relatedAssets:
          type: array
          items:
            type: string
        missingInfo:
          type: array
          items:
            type: string
    Citation:
      type: object
      properties:
        documentId:
          type: string
        documentTitle:
          type: string
        accessLevel:
          $ref: "#/components/schemas/DocumentAccessLevel"
        sensitivity:
          $ref: "#/components/schemas/DocumentSensitivity"
        sourceDownloadAllowed:
          type: boolean
          description: Whether the current caller may open the original source document behind this citation.
        page:
          type: integer
        snippet:
          type: string
    Asset:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        plantId:
          type: string
        assetTag:
          type: string
        assetName:
          type: string
        assetType:
          type: string
        location:
          type: string
        criticality:
          type: string
        riskScore:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetProfile:
      allOf:
        - $ref: "#/components/schemas/Asset"
        - type: object
          properties:
            failures:
              type: array
              items:
                $ref: "#/components/schemas/RcaRecord"
            documents:
              type: array
              items:
                $ref: "#/components/schemas/LinkedDocument"
            complianceGaps:
              type: array
              items:
                $ref: "#/components/schemas/ComplianceGap"
    LinkedDocument:
      allOf:
        - $ref: "#/components/schemas/DocumentAccessFields"
        - type: object
          properties:
            id:
              type: string
            title:
              type: string
            documentType:
              type: string
            status:
              $ref: "#/components/schemas/DocumentStatus"
            createdAt:
              type: string
              format: date-time
    RcaGenerateRequest:
      type: object
      required: [assetTag, failureDescription]
      properties:
        assetTag:
          type: string
        failureDescription:
          type: string
        plantId:
          type: string
          format: uuid
    RcaResponse:
      type: object
      required: [summary, probableCauses, recommendations, confidence, citations]
      properties:
        summary:
          type: string
        probableCauses:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        confidence:
          type: number
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
    RcaRecord:
      type: object
      properties:
        id:
          type: string
        failureSummary:
          type: string
        timeline:
          type: array
          items:
            type: string
        probableCauses:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        confidence:
          type: number
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    ComplianceGap:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        plantId:
          type: string
        assetId:
          type: string
        assetTag:
          type: string
        requirementId:
          type: string
        gapType:
          type: string
        description:
          type: string
        severity:
          type: string
        evidenceDocumentId:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ComplianceScanGap:
      type: object
      properties:
        assetTag:
          type: string
