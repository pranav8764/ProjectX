openapi: 3.1.0
info:
  title: "Legacy planning sketch: API Gateway"
  version: 0.1.0
  description: Legacy domain-service contract sketch for a possible future split. The consolidated MVP public API is contracts/openapi/api.yaml.
x-contract-status: legacy-domain-sketch
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Gateway is healthy
  /api/documents/upload:
    post:
      summary: Create a document upload
      tags: [Documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [plantId, file]
              properties:
                plantId:
                  type: string
                documentType:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Upload accepted
  /api/copilot/query:
    post:
      summary: Ask the RAG copilot
      tags: [Copilot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotQueryRequest"
      responses:
        "200":
          description: Cited answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotQueryResponse"
  /api/assets/{assetId}:
    get:
      summary: Get asset profile
      tags: [Assets]
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset profile
  /api/rca/generate:
    post:
      summary: Generate RCA
      tags: [RCA]
      responses:
        "202":
          description: RCA generation started
  /api/compliance/gaps:
    get:
      summary: List compliance gaps
      tags: [Compliance]
      responses:
        "200":
          description: Gap list
  /api/reports:
    post:
      summary: Generate report
      tags: [Reports]
      responses:
        "202":
          description: Report generation started
components:
  schemas:
    CopilotQueryRequest:
      type: object
      required: [question, plantId]
      properties:
        question:
          type: string
        plantId:
          type: string
        filters:
          type: object
          properties:
            assetTag:
              type: string
            documentTypes:
              type: array
              items:
                type: string
    CopilotQueryResponse:
      type: object
      required: [answer, confidence, citations]
      properties:
        answer:
          type: string
        confidence:
          type: number
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        relatedAssets:
          type: array
          items:
            type: string
        missingInfo:
          type: array
          items:
            type: string
    Citation:
      type: object
      properties:
        documentId:
          type: string
        documentTitle:
          type: string
        page:
          type: integer
        snippet:
          type: string
