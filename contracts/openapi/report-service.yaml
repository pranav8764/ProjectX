openapi: 3.1.0
info:
  title: "Legacy planning sketch: Report Service"
  version: 0.1.0
  description: Legacy domain-service contract sketch for a possible future split. Report APIs currently run in services/api.
x-contract-status: legacy-domain-sketch
paths:
  /health:
    get:
      responses:
        "200":
          description: Healthy
  /internal/reports:
    post:
      summary: Create report job
      responses:
        "202":
          description: Report job accepted
  /internal/reports/{reportId}:
    get:
      summary: Get report job
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report job
