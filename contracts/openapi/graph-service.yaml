openapi: 3.1.0
info:
  title: "Legacy planning sketch: Graph Service"
  version: 0.1.0
  description: Legacy domain-service contract sketch for a possible future split. Graph writes currently run in services/ai.
x-contract-status: legacy-domain-sketch
paths:
  /health:
    get:
      responses:
        "200":
          description: Healthy
  /internal/graph/expand:
    post:
      summary: Expand graph context around entities
      responses:
        "200":
          description: Graph context
  /internal/graph/assets/{assetId}:
    get:
      summary: Get graph for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset graph
